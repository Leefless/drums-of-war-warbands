<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drums of War: Warbands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking the first paint: a LAN table may have no internet; the fallbacks render at once. -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark"></span><span>Drums of War</span><span class="sub">Warbands</span></div>
    <div id="phase" class="phase"></div>
    <div id="players" class="players"></div>
    <button id="rulesBtn" class="ghost small" title="Open the rulebook">Rules</button>
    <button id="endBattle" class="ghost small danger" title="End this computer-only battle and return to the muster" hidden>End battle</button>
    <button id="surrender" class="ghost small danger" title="Concede the battle and leave the field" hidden>Surrender</button>
    <button id="theme" class="ghost small" title="Toggle light or dark">Theme</button>
  </header>
  <div id="stale" class="stale" role="alert" hidden><span id="staleMsg"></span> <button id="restartNow" class="small" hidden>Restart now</button></div>
  <div id="rulesHost"></div>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="offline" class="offline" role="alert" hidden>Connection to the table lost. Reconnecting...</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
