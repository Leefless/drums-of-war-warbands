<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Art receiver</title>
<style>body{font:15px/1.5 Georgia,serif;background:#14110C;color:#EADFC8;padding:24px}</style></head>
<body>
<h1>Art receiver</h1>
<p>Keep this tab open while art is transferred from the generator tab. Files go to the Art folder on the host.</p>
<p id="count">0 received</p>
<script>
// Accepts { name, data } messages from the art pipeline tab and saves them via the local server.
// Only the ChatGPT tab that runs the art pipeline (or this server itself) may hand over files.
const ALLOWED = ["https://chatgpt.com", "https://chat.openai.com", location.origin];
let n = 0;
window.addEventListener("message", async (ev) => {
  if (!ALLOWED.includes(ev.origin)) return;
  const { name, data, id } = ev.data || {};
  if (!name || !data) return;
  // Always answer the sender, even when the request itself fails, so the pipeline tab never waits forever.
  let ok = false;
  let status = 0;
  try {
    const res = await fetch("/api/art-upload", { method: "POST", headers: { "content-type": "application/json", "x-dow-art": "1" }, body: JSON.stringify({ name, data }) });
    ok = res.ok;
    status = res.status;
  } catch {
    status = -1;
  }
  if (ok) document.getElementById("count").textContent = `${++n} received`;
  ev.source?.postMessage({ ack: id, ok, status }, ev.origin);
});
</script>
</body>
</html>
